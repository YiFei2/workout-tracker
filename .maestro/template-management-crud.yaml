appId: com.anonymous.workouttracker
---
# Covers Template Management CRUD paths not exercised by create-template.yaml:
# list view with exercise count across multiple templates, rename, edit an
# exercise's name/rest, edit/remove individual sets, remove an exercise, and
# delete a whole template.
- launchApp:
    clearState: true
- assertVisible: "Templates"
- assertVisible: "No templates yet — create one to get started."

# --- Template 1: "Pull Day" with two exercises, to check "N exercises" list count ---
- tapOn: "+ New Template"
- inputText: "Pull Day"
- tapOn: "Create"
- assertVisible: "Pull Day"

- tapOn: "+ Add Exercise"
- tapOn: "e.g. Bench Press"
- inputText: "Lat Pulldown"
- tapOn: "e.g. 90"
- eraseText
- inputText: "60"
- tapOn: "Add"
- assertVisible: "Lat Pulldown"
- assertVisible: "Rest: 60s"

- tapOn: "+ Add Exercise"
- tapOn: "e.g. Bench Press"
- inputText: "Seated Row"
- tapOn: "e.g. 90"
- eraseText
- inputText: "45"
- tapOn: "Add"
- assertVisible: "Seated Row"
- assertVisible: "Rest: 45s"

- back
- assertVisible: "Pull Day"
- assertVisible: "2 exercises"

# --- Template 2: "Leg Day" with one exercise, to check singular "1 exercise" ---
- tapOn: "+ New Template"
- inputText: "Leg Day"
- tapOn: "Create"
- assertVisible: "Leg Day"

- tapOn: "+ Add Exercise"
- tapOn: "e.g. Bench Press"
- inputText: "Squat"
- tapOn: "e.g. 90"
- eraseText
- inputText: "120"
- tapOn: "Add"
- assertVisible: "Squat"
- assertVisible: "Rest: 120s"

- back
- assertVisible: "Leg Day"
- assertVisible: "1 exercise"
- assertVisible: "Pull Day"
- assertVisible: "2 exercises"

# --- Rename "Leg Day" ---
- tapOn: "Leg Day"
- assertVisible: "Tap to rename"
- tapOn: "Tap to rename"
- assertVisible: "Rename Template"
# Name field is autoFocus and pre-filled with "Leg Day" — erase the focused
# field directly rather than tapping the ambiguous pre-filled text.
- eraseText
- inputText: "Leg Day B"
- tapOn: "Save"
- assertVisible: "Leg Day B"

- back
- assertVisible: "Leg Day B"
- assertVisible: "1 exercise"

# --- Edit an exercise's name and rest duration ---
- tapOn: "Leg Day B"
- tapOn: "Squat"
- assertVisible: "Edit Exercise"
# Exercise name field is autoFocus and pre-filled with "Squat".
- eraseText
- inputText: "Front Squat"
# Rest field shows the pre-filled value "120", distinct from the label
# "Rest: 120s" behind the overlay — anchor the regex so it can't match that.
- tapOn: "^120$"
- eraseText
- inputText: "150"
- tapOn: "Save"
- assertVisible: "Front Squat"
- assertVisible: "Rest: 150s"

# --- Edit an individual set (reps/weight) ---
# Front Squat starts with one default set: reps 10, weight 0.
# Use longPressOn (which selects the field's existing content) instead of
# tapOn+eraseText: a plain tapOn places the cursor wherever it lands inside
# the text (often mid-string for a 2-digit value), so eraseText's backspaces
# only clear what's left of the cursor and inputText then inserts at that
# same non-end position — e.g. "10" -> tap lands between "1"/"0" -> erase
# removes "1" -> typing "8" inserts before the remaining "0" -> "80". A long
# press selects the run of text under it, so the following inputText
# replaces it outright. To commit the field (onEndEditing fires on blur)
# tap a neutral, non-interactive label ("Set 1") instead of hideKeyboard —
# hideKeyboard sends a raw back-press to dismiss the keypad, and if the
# keypad already auto-dismissed (as observed after longPressOn+inputText
# here) that back-press instead falls through to Expo Router and pops the
# whole template-detail screen. Tapping "Set 1" also avoids the on-screen
# numeric keypad's own digit keys ("0".."9"), which are text nodes that
# would otherwise collide with bare-digit selectors like "^0$" or "^8$".
- longPressOn: "^10$"
- inputText: "8"
- tapOn: "Set 1"
- assertVisible: "^8$"
- longPressOn: "^0$"
- inputText: "60"
- tapOn: "Set 1"
- assertVisible: "^8$"
- assertVisible: "^60$"

# --- Add a second set, then remove it ---
- tapOn: "+ Add Set"
- assertVisible: "Set 2"
- tapOn:
    text: "✕"
    index: 2
- assertNotVisible: "Set 2"

# --- Remove the exercise entirely ---
- tapOn:
    text: "✕"
    index: 0
- assertVisible: "Remove exercise"
- tapOn: "Remove"
- assertNotVisible: "Front Squat"
- assertVisible: "No exercises yet — add one below."

# --- Delete the template ---
- tapOn: "Delete Template"
- assertVisible: "Delete template"
- tapOn: "Delete"
- assertVisible: "Templates"
- assertNotVisible: "Leg Day B"
- assertVisible: "Pull Day"
