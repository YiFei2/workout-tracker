appId: com.anonymous.workouttracker
---
# Covers Template Management CRUD paths not exercised by create-template.yaml:
# list view with exercise count across multiple templates, rename, edit an
# exercise's name/rest, edit/remove individual sets, remove an exercise, and
# delete a whole template.
# The exercise library seeds four sample templates (Push Day, Pull Day, Leg
# Day, Full Body) on fresh install, so the Templates list is never actually
# empty after clearState. This test's own templates use distinct "QA ..."
# names to avoid any ambiguity against the seeded ones.
- launchApp:
    clearState: true
- assertVisible: "Templates"
- assertVisible: "Push Day"

# --- Template 1: "QA Pull Template" with two exercises, to check "N exercises" list count ---
- tapOn: "+ New Template"
- inputText: "QA Pull Template"
- tapOn: "Create"
- assertVisible: "QA Pull Template"

- tapOn: "+ Add Exercise"
- tapOn: "Tap to choose an exercise"
- tapOn: "Search exercises…"
# Search a partial prefix rather than the exact full name: an exact-name
# query makes the search box's own displayed value textually identical to
# the single matching row's label, which is ambiguous for a text-based tap
# selector (not an issue for a real user, who taps a specific visual
# location) — see exercise-library-quirks-report.md #6.
- inputText: "Lat Pull"
- tapOn: "Lat Pulldown"
- tapOn: "e.g. 90"
- eraseText
- inputText: "60"
- tapOn: "^Add$"
- assertVisible: "Lat Pulldown"
- assertVisible: "Rest: 60s"

- tapOn: "+ Add Exercise"
- tapOn: "Tap to choose an exercise"
- tapOn: "Search exercises…"
- inputText: "Seated Row"
- tapOn: '.*Add "Seated Row" as new exercise.*'
- tapOn: "e.g. 90"
- eraseText
- inputText: "45"
- tapOn: "^Add$"
- assertVisible: "Seated Row"
- assertVisible: "Rest: 45s"

- back
- assertVisible: "QA Pull Template"
- assertVisible: "2 exercises"

# --- Template 2: "QA Leg Template" with one exercise, to check singular "1 exercise" ---
- tapOn: "+ New Template"
- inputText: "QA Leg Template"
- tapOn: "Create"
- assertVisible: "QA Leg Template"

- tapOn: "+ Add Exercise"
- tapOn: "Tap to choose an exercise"
- tapOn: "Search exercises…"
- inputText: "Back Sq"
- tapOn: "Back Squat"
- tapOn: "e.g. 90"
- eraseText
- inputText: "120"
- tapOn: "^Add$"
- assertVisible: "Back Squat"
- assertVisible: "Rest: 120s"

- back
- assertVisible: "QA Leg Template"
- assertVisible: "1 exercise"
- assertVisible: "QA Pull Template"
- assertVisible: "2 exercises"

# --- Rename "QA Leg Template" ---
- tapOn: "QA Leg Template"
- assertVisible: "Tap to rename"
- tapOn: "Tap to rename"
- assertVisible: "Rename Template"
# Name field is autoFocus and pre-filled with "QA Leg Template" — erase the
# focused field directly rather than tapping the ambiguous pre-filled text.
- eraseText
- inputText: "QA Leg Template B"
- tapOn: "Save"
- assertVisible: "QA Leg Template B"

- back
- assertVisible: "QA Leg Template B"
- assertVisible: "1 exercise"

# --- Edit an exercise's identity and rest duration ---
- tapOn: "QA Leg Template B"
- tapOn: "Back Squat"
- assertVisible: "Edit Exercise"
# Exercise field is a button pre-filled with "Back Squat" — tap it to
# reopen the picker, then search for a different seeded exercise.
# Two "Back Squat" text nodes exist at this point (the underlying template
# screen's exercise card, and the form's own picker button) — the
# underlying one is marked important-for-accessibility="no-hide-descendants"
# so a real screen reader / touch can't reach it, but Maestro's own tap
# resolution doesn't honor that flag and matches by document order, so an
# index is needed to hit the right one (confirmed via manual adb taps that
# the real app behaves correctly here — this is a test-only workaround).
- tapOn:
    text: "Back Squat"
    index: 1
- tapOn: "Search exercises…"
- inputText: "Front Sq"
- tapOn: "Front Squat"
# Rest field shows the pre-filled value "120", distinct from the label
# "Rest: 120s" behind the overlay — anchor the regex so it can't match that.
- tapOn: "^120$"
- eraseText
- inputText: "150"
- tapOn: "Save"
- assertVisible: "Front Squat"
- assertVisible: "Rest: 150s"

# --- Remove the exercise entirely ---
# (No per-set editing on templates anymore — sets/reps/weight were removed
# from templates entirely by the location-scoped history feature; templates
# are now just ordered exercise slots. The old "edit an individual set" /
# "add a second set" coverage that used to live here tested a feature that
# no longer exists.)
- tapOn:
    text: "✕"
    index: 0
- assertVisible: "Remove exercise"
- tapOn: "Remove"
- assertNotVisible: "Front Squat"
- assertVisible: "No exercises yet — add one below."

# --- Delete the template ---
- tapOn: "Delete Template"
- assertVisible: "Delete template"
- tapOn: "Delete"
- assertVisible: "Templates"
- assertNotVisible: "QA Leg Template B"
- assertVisible: "QA Pull Template"
